
name: Sirket Verilerini Guncelle

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi GitHub'dan indir
        uses: actions/checkout@v4

      - name: Python ortamini hazirla
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sirket verilerini guncelle
        run: python update_data.py

      - name: Guncel dosyalari GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Sirket verileri otomatik guncellendi"
            git push
          else
            echo "Dosyalarda degisiklik yok."
          fi
